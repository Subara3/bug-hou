name: feeds

# Claudeの仕分け（triage.json）がpushされたら、フィードに判定を反映する
on:
  push:
    branches: [main]
    paths: [docs/data/triage.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/feeds.py
      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feeds
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "feeds: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
